name: galaxy-express-99-product

x-db-env: &db-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: galaxy
  PGDATABASE: galaxy_express_99
  PGPASSWORD_FILE: /run/gx99-product-secrets/postgres-password

services:
  init-secrets:
    image: alpine:3.22
    restart: "no"
    volumes:
      - product_runtime_secrets:/run/gx99-product-secrets
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /run/gx99-product-secrets/postgres-password ]; then
          umask 077
          head -c 48 /dev/urandom | base64 > /run/gx99-product-secrets/postgres-password
        fi

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: galaxy
      POSTGRES_DB: galaxy_express_99
      POSTGRES_PASSWORD_FILE: /run/gx99-product-secrets/postgres-password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55500}:5432"
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
      - product_runtime_secrets:/run/gx99-product-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galaxy -d galaxy_express_99"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  init-db:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
    volumes:
      - ./db/schema.sql:/schema.sql:ro
      - product_runtime_secrets:/run/gx99-product-secrets:ro
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /run/gx99-product-secrets/postgres-password)"
        psql -v ON_ERROR_STOP=1 -f /schema.sql
    security_opt:
      - no-new-privileges:true

  product-api:
    build:
      context: .
      dockerfile: docker/node-dev.Dockerfile
    restart: unless-stopped
    working_dir: /workspace
    command: npm run dev --workspace @gx99/product-api
    depends_on:
      init-db:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      PORT: "8320"
      AI_PROXY_URL: ${AI_PROXY_URL:-http://host.docker.internal:8318}
      AI_API_KEY_FILE: /run/secrets/cli-proxy-config.yaml
      AI_MODEL: ${AI_MODEL:-gpt-5.6-terra}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-low}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-900}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-1000}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-12}
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${PRODUCT_API_PORT:-8320}:8320"
    volumes:
      - .:/workspace:ro
      - product_node_modules:/workspace/node_modules
      - product_runtime_secrets:/run/gx99-product-secrets:ro
      - ${HOME}/.cli-proxy-api/merged-config.yaml:/run/secrets/cli-proxy-config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8320/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  product-web:
    build:
      context: .
      dockerfile: docker/node-dev.Dockerfile
    restart: unless-stopped
    working_dir: /workspace
    command: npm run dev --workspace @gx99/product-web -- --host 0.0.0.0
    depends_on:
      product-api:
        condition: service_healthy
    environment:
      PRODUCT_API_TARGET: http://product-api:8320
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${PRODUCT_WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace:ro
      - product_node_modules:/workspace/node_modules
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5173/galaxy-express/preview/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  product_node_modules:
  product_postgres_data:
  product_runtime_secrets:
